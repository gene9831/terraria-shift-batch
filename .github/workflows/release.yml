name: CI and tag release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -Raw manifest.json | ConvertFrom-Json).version
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { 'v' + $version }
          ./ci/Validate-Release.ps1 -TagName $tag
          if ($env:REF_TYPE -eq 'tag') {
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main.' }
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
      - name: Download verified public dependencies
        run: ./ci/Prepare-Dependencies.ps1 -InstallXna
      - name: Run native tests and real package regressions
        run: ./tests/Test-Package.ps1 -TerrariaPath "$env:GITHUB_WORKSPACE/.ci-deps/game"
      - name: Verify release rules and reject corrupt archives
        run: ./tests/Test-Release.ps1
      - name: Audit client references and stage release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./ci/Assert-ClientReferences.ps1 -DllPath ./build/ShiftBatch.dll -CecilPath ./.ci-deps/game/TerrariaModder/core/deps/Mono.Cecil.dll
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          foreach ($name in @("ShiftBatch-$env:VERSION.zip", "ShiftBatch-$env:VERSION-source.zip")) {
            Copy-Item -LiteralPath (Join-Path build/package-check $name) -Destination dist
          }
          ./ci/Verify-Package.ps1 -Version $env:VERSION -PackageDirectory dist -WriteChecksums
      - name: Upload verified release candidates
        id: artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shift-batch-${{ steps.version.outputs.version }}
          path: |
            dist/ShiftBatch-${{ steps.version.outputs.version }}.zip
            dist/ShiftBatch-${{ steps.version.outputs.version }}-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets
          merge-multiple: true
      - name: Verify downloaded candidates
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$RELEASE_TAG" = "v$VERSION"
          notes="docs/releases/$VERSION.md"
          test -f "$notes"
          cp "$notes" release-notes.md
          printf '\n\nBuilt by [GitHub Actions](%s/%s/actions/runs/%s) from commit `%s`.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> release-notes.md
          gh release create "$RELEASE_TAG" \
            "release-assets/ShiftBatch-$VERSION.zip" \
            "release-assets/ShiftBatch-$VERSION-source.zip" \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Shift Batch $VERSION" --notes-file release-notes.md
